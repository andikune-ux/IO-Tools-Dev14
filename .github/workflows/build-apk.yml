name: Build and Sign iD-Tools APK

on:
  push:
    branches: ["main", "master", "fix/io-tools-hardening-and-tool-audit"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.signing.outputs.release_ready }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android

      - name: Configure release signing
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            test -s "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; building a debug APK only."
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.release_ready == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace

      - name: Build debug APK
        if: steps.signing.outputs.release_ready != 'true'
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.release_ready }}" == "true" ]]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            cp "$APK_PATH" "iD-Tools-Dev14-Release.apk"
          else
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            cp "$APK_PATH" "iD-Tools-Dev14-Debug.apk"
          fi
          test -s "$APK_PATH"
          echo "path=$([[ "${{ steps.signing.outputs.release_ready }}" == "true" ]] && echo iD-Tools-Dev14-Release.apk || echo iD-Tools-Dev14-Debug.apk)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iD-Tools-Dev14-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

  publish:
    name: Publish signed release
    needs: build
    if: needs.build.outputs.release_ready == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: iD-Tools-Dev14-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-${{ github.run_number }}
          name: "iD-Tools Dev14.Apk v1.4.0 (Build #${{ github.run_number }})"
          body: |
            ### iD-Tools Dev14.Apk
            - Package: `dev.andikune.iottools`
            - Signed release build produced by GitHub Actions.
            - Install/update using the same release signing key.
          files: iD-Tools-Dev14-Release.apk
