name: Build and Sign iD-Tools APK

on:
  push:
    branches: ["main", "master", "fix/io-tools-hardening-and-tool-audit"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      publish_ready: ${{ steps.signing.outputs.publish_ready }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android

      - name: Configure release signing
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$ANDROID_KEY_ALIAS" ]]; then
            # Accept raw Base64, wrapped lines, or a copied KEY=value line.
          KEYSTORE_B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          case "$KEYSTORE_B64" in
            ANDROID_KEYSTORE_BASE64=*) KEYSTORE_B64="${KEYSTORE_B64#ANDROID_KEYSTORE_BASE64=}" ;;
          esac
          if [[ ! "$KEYSTORE_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 contains invalid characters. Replace the repository secret with the raw Base64 value from the signing package."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/my-upload-key.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"
          echo "Production signing keystore decoded and validated."
          else
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production signing secrets are incomplete. Release APK will use a temporary CI key and is for validation only."
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && format('{0}/my-upload-key.jks', github.workspace) || format('{0}/debug.keystore', github.workspace) }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: gradle assembleRelease -PAPP_VERSION_CODE=${{ github.run_number }} -PAPP_VERSION_NAME=1.4.0 --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug -PAPP_VERSION_CODE=${{ github.run_number }} -PAPP_VERSION_NAME=1.4.0 --stacktrace

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"
          if [[ "${{ steps.signing.outputs.publish_ready }}" == "true" ]]; then
            cp "$RELEASE_APK" "iD-Tools-Dev14-Release.apk"
            echo "artifact_name=iD-Tools-Dev14-Release" >> "$GITHUB_OUTPUT"
          else
            cp "$RELEASE_APK" "iD-Tools-Dev14-Release-CI-Validation-Only.apk"
            echo "artifact_name=iD-Tools-Dev14-Release-CI-Validation-Only" >> "$GITHUB_OUTPUT"
          fi
          cp "$DEBUG_APK" "iD-Tools-Dev14-Debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: |
            iD-Tools-Dev14-*.apk
          retention-days: 30

  publish:
    name: Publish signed release
    needs: [build, unit-tests]
    if: always() && needs.build.result == 'success' && needs.unit-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed APK
        if: needs.build.outputs.publish_ready == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/download-artifact@v4
        with:
          name: iD-Tools-Dev14-Release

      - name: Create GitHub Release
        if: needs.build.outputs.publish_ready == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-${{ github.run_number }}
          name: "iD-Tools Dev14.Apk v1.4.0 (Build #${{ github.run_number }})"
          body: |
            ### iD-Tools Dev14.Apk
            - Package: `dev.andikune.iottools`
            - Production-signed release build produced by GitHub Actions.
            - Install/update using the same release signing key.
          files: iD-Tools-Dev14-Release.apk

      - name: Explain why production publishing was not performed
        if: needs.build.outputs.publish_ready != 'true' || github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master')
        shell: bash
        env:
          PUBLISH_READY: ${{ needs.build.outputs.publish_ready }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          {
            echo "## Production release not published"
            if [[ "$PUBLISH_READY" != "true" ]]; then
              echo "- Production signing secrets are missing or incomplete."
              echo "- The Release APK is available as a CI validation-only artifact."
            fi
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "- Pull request runs do not publish GitHub Releases."
            fi
            if [[ "$GIT_REF" != "refs/heads/main" && "$GIT_REF" != "refs/heads/master" ]]; then
              echo "- Current ref is $GIT_REF; production releases are published only from main/master."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Publish job ran, but production publishing conditions were not met."

  cleanup-artifacts:
    name: Keep Only 3 Latest Workflow Artifacts
    needs: [build, unit-tests, publish]
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-artifact-retention
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: Delete older artifacts (keep newest 3)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const managed = artifacts
              .sort((a, b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at) ||
                b.id - a.id
              );

            const stale = managed.slice(3);
            for (const artifact of stale) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted ${artifact.name} (ID: ${artifact.id})`);
            }

            core.summary
              .addHeading("APK artifact retention")
              .addRaw(`Found ${managed.length} APK artifacts; deleted ${stale.length}; retained ${Math.min(managed.length, 3)} newest artifacts.`)
              .write();
\\r'/}"
