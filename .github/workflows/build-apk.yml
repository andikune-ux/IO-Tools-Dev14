name: Build and Sign iD-Tools APK

on:
  push:
    branches: ["main", "master", "fix/io-tools-hardening-and-tool-audit"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.signing.outputs.release_ready }}
      publish_ready: ${{ steps.signing.outputs.publish_ready }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android

      - name: Configure release signing
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            test -s "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            echo "publish_ready=true" >> "$GITHUB_OUTPUT"
            echo "Using the configured upload keystore for the production-signed release APK."
          else
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production signing secrets are not configured. Building the release variant with a temporary CI debug key; this APK is for build validation only and cannot be used for production updates or publishing."
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && format('{0}/my-upload-key.jks', github.workspace) || format('{0}/debug.keystore', github.workspace) }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: gradle assembleRelease --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"
          if [[ "${{ steps.signing.outputs.publish_ready }}" == "true" ]]; then
            cp "$RELEASE_APK" "iD-Tools-Dev14-Release.apk"
            echo "artifact_name=iD-Tools-Dev14-Release" >> "$GITHUB_OUTPUT"
          else
            cp "$RELEASE_APK" "iD-Tools-Dev14-Release-CI-Validation-Only.apk"
            echo "artifact_name=iD-Tools-Dev14-Release-CI-Validation-Only" >> "$GITHUB_OUTPUT"
          fi
          cp "$DEBUG_APK" "iD-Tools-Dev14-Debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: |
            iD-Tools-Dev14-*.apk
          retention-days: 30

  publish:
    name: Publish signed release
    needs: build
    if: needs.build.outputs.publish_ready == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: iD-Tools-Dev14-Release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-${{ github.run_number }}
          name: "iD-Tools Dev14.Apk v1.4.0 (Build #${{ github.run_number }})"
          body: |
            ### iD-Tools Dev14.Apk
            - Package: `dev.andikune.iottools`
            - Production-signed release build produced by GitHub Actions.
            - Install/update using the same release signing key.
          files: iD-Tools-Dev14-Release.apk
